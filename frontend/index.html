<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortly - URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    input, button { font-size: 16px; padding: 10px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
    button { cursor: pointer; }
    .result { margin-top: 16px; padding: 12px; background: #f2f4f7; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>Shortly</h1>
  <p>A serverless URL shortener on AWS Lambda, API Gateway and DynamoDB.</p>

  <input id="longUrl" type="url" placeholder="https://example.com/a/very/long/link">
  <button id="shortenBtn">Shorten</button>
  <div class="result" id="shortenResult"></div>

  <h2>Link stats</h2>
  <input id="code" placeholder="Short code, e.g. aB3xK9q">
  <button id="statsBtn">Get stats</button>
  <div class="result" id="statsResult"></div>

  <script>
    // Replace with your API Gateway Invoke URL (no trailing slash) before uploading to S3.
    const API = "YOUR_API";

    function show(id, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.style.display = "block";
    }

    document.getElementById("shortenBtn").onclick = async () => {
      const url = document.getElementById("longUrl").value.trim();
      try {
        const res = await fetch(`${API}/shorten`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        show("shortenResult", res.ok ? `Short link: ${data.short_url}` : `Error: ${data.error}`);
      } catch (e) {
        show("shortenResult", "Network error. Check the API URL and CORS settings.");
      }
    };

    document.getElementById("statsBtn").onclick = async () => {
      const code = document.getElementById("code").value.trim();
      try {
        const res = await fetch(`${API}/stats/${encodeURIComponent(code)}`);
        const data = await res.json();
        show("statsResult", res.ok
          ? `${data.url} has been clicked ${data.clicks} times`
          : `Error: ${data.error}`);
      } catch (e) {
        show("statsResult", "Network error.");
      }
    };
  </script>
</body>
</html>
